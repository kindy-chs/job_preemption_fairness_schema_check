[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kindy-chs-job_preemption_fairness_schema_check"
version = "0.1.0"
description = "从样本里推断实时数仓架构师·作业抢占与调度公平性应有的字段集合，逐字段检查存在性与类型，缺失项单独列出"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "kindy-chs" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://kindy-chs.github.io"
Repository = "https://github.com/kindy-chs/job_preemption_fairness_schema_check"
Issues = "https://github.com/kindy-chs/job_preemption_fairness_schema_check/issues"

[project.scripts]
job_preemption_fairness_schema_check = "job_preemption_fairness_schema_check:main"

[tool.setuptools]
py-modules = ["job_preemption_fairness_schema_check"]
